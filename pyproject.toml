[project]
name = "chatagent"
version = "0.1.0"
description = "Team chat -> headless Claude Code -> GitHub issues, for any chat a reader can archive"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatagent"]
